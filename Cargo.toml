[package]
name = "emgr"
version = "0.1.2"
edition = "2024"
# A deployed service, never published to crates.io. Also lets cargo-deny's
# `allow-wildcard-paths` apply, which it refuses to do for public crates.
publish = false
# benches/fixtures.rs is a shared module (pulled in via `#[path]` by the
# real bench targets below, the `benchmark` bin, and tests/), not a bench
# target itself - disable autodiscovery so Cargo doesn't also try to treat
# it as one.
autobenches = false

[lib]
name = "emgr"
path = "src/lib.rs"
bench = false          # criterion owns `cargo bench`; lib has no bench harness

[[bin]]
name = "emgr"
path = "src/main.rs"
bench = false

[[bin]]
name = "healthcheck"
path = "src/bin/healthcheck.rs"
bench = false

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
bench = false

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "resize"
harness = false

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "cache_key"
harness = false

[[bench]]
name = "pipeline"
harness = false

[dependencies]
mimalloc = "0.1"

axum = { version = "0.8", features = ["tracing", "tokio", "macros"] }
axum-otel-metrics = { version = "0.11" }
axum-tracing-opentelemetry = { version = "0.29" }
tower-http = { version = "0.6", features = ["compression-full", "cors"] }

tokio = { version = "1", features = ["full"] }

reqwest = { version = "0.12", features = ["json", "stream", "http2", "gzip"] } # Optimized HTTP client
# default-features = false (#67/#68): `image`'s own `default` feature set
# pulls in `default-formats`, which includes `avif` (ravif/rav1e) among
# many formats this crate never uses (bmp/dds/exr/ff/hdr/ico/pnm/qoi/tga/
# tiff) - `features = [...]` alone is *additive* to defaults, not a
# replacement for them, so the explicit "jpeg"/"png"/"webp"/"gif" list
# below was never actually narrowing anything before this change; every
# one of those extra formats (plus `ravif`/`rav1e`, replaced by
# `libavif-sys` - see that dependency's own comment) was still being
# compiled in regardless. `rayon` (also part of `default`) is dropped too:
# nothing in this crate's code calls an `image`-crate API gated behind it.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] } # gif for animation groundwork
# AVIF encode+decode (#67/#68): dropped `image`'s own "avif" feature
# (ravif/rav1e, encode-only, no AVIF *decode* at all - see the `ImageFormat`
# doc comment in src/models/params.rs) in favour of `libavif-sys`, which
# covers both directions through one dependency - real libavif (vendored C
# source, built from source via `cmake`, statically linked) with AOM
# (encode) and dav1d (decode) as its only compiled-in codecs. See
# src/services/image/avif_codec.rs's own module doc comment for why this
# crate over the alternatives evaluated (`avif-rs` downloads prebuilt
# binaries from a third-party GitHub release at build time - rejected as a
# supply-chain regression; the high-level `libavif` crate has no EXIF-write
# API), and why AOM only, not AOM+SVT-AV1 (no crates.io libavif binding
# wires SVT-AV1 into its build script).
libavif-sys = { version = "0.17", default-features = false, features = ["codec-aom", "codec-dav1d"] }
num_cpus = "1.16" # CPU detection for optimal thread pool sizing
bytes = "1.5" # Efficient byte handling
futures = "0.3" # Stream processing utilities

aws-config = { version = "1.6", optional = true, features = ["behavior-version-latest"] } # AWS SDK configuration (for MinIO)
# default-features = false + explicit feature list (GH #56): aws-sdk-s3's own
# `default` feature set pulls in BOTH TLS stacks at once - "rustls" (misleading
# name; it actually means the *legacy* hyper-0.14/rustls-0.21/h2-0.3 connector,
# vulnerable to RUSTSEC-2026-0258/0098/0099/0104) alongside "default-https-client"
# (the modern hyper-1/rustls-0.23/h2-0.4 connector that is actually used at
# runtime under BehaviorVersion::latest()). Dropping "rustls" removes the legacy
# stack from the dependency graph entirely instead of merely leaving it unused.
aws-sdk-s3 = { version = "1.90", optional = true, default-features = false, features = ["behavior-version-latest", "default-https-client", "http-1x", "rt-tokio", "sigv4a"] } # AWS S3 client (MinIO compatible)

envconfig = { version = "0.11" }
derive_builder = { version = "0.20" }
anyhow = { version = "1" }
thiserror = { version = "2" }
urlencoding = "2.1"
url = "2.5"      # source-URL parsing and scheme validation (#21)
ipnet = "2.9"    # private/link-local range checks for SSRF filtering (#21)

# For hashing the cache key
sha2 = "0.10"   # NOT "0": 0.11 changed finalize()'s return type and breaks the cache key

# For async traits
async-trait = "0.1" # Required for async methods in traits

# Deterministic RNG for the generated fixture corpus (benches/fixtures.rs),
# also linked into the `benchmark` bin, which serves that same corpus locally.
rand = "0.8"

# Machine-readable output for the `benchmark` load-test bin (BENCHMARK_JSON_OUTPUT)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

opentelemetry = { version = "0.29", optional = true }
opentelemetry-otlp = { version = "0.29", optional = true, features = ["tokio", "metrics", "trace", "grpc-tonic", "gzip-tonic"] }
opentelemetry_sdk = { version = "0.29", optional = true, features = ["tokio", "metrics", "rt-tokio", "trace"] }
opentelemetry-prometheus = { version = "0.29", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "fmt"] }
tracing-opentelemetry = { version = "0.31", optional = true }
tracing = { version = "0.1", features = ["attributes"] }
prometheus = { version = "0.14", optional = true }
dashmap = "6"
tower_governor = "0.8"
webp = "0.3"
hmac = "0.12"
subtle = "2.6"
base64 = "0.22"
fast_image_resize = { version = "6.1", features = ["image"] }
mozjpeg = "0.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.prod]
inherits = "release"
lto = true
opt-level = "z"
codegen-units = 1
strip = true

# Performance-optimized profile for maximum speed
[profile.perf]
inherits = "release"
lto = "fat"
opt-level = 3
codegen-units = 1
# NOT panic = "abort": this service decodes attacker-supplied image bytes, and a
# panic in a codec would take the whole process down with it - a trivial DoS.
# Unwinding keeps a future catch boundary around the decode stage possible.
# See issue #29.
panic = "unwind"
strip = true

[features]
default = []
local_fs = []
otel = [
    "opentelemetry",
    "opentelemetry-otlp",
    "opentelemetry_sdk",
    "opentelemetry-prometheus",
    "tracing-subscriber",
    "tracing-opentelemetry",
    "prometheus"
]
s3 = ["aws-sdk-s3", "aws-config"]
in_memory = []
