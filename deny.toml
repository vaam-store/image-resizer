# cargo-deny configuration (GH #46). Run locally with `cargo deny check`.
#
# Four checks, all wired into CI (.github/workflows/ci.yml):
#   advisories - RUSTSEC vulnerability / unmaintained / yanked scanning.
#     There was no advisory scanning at all before this on a dependency
#     tree that includes several image codecs (jpeg/png/webp) parsing
#     attacker-supplied bytes - exactly the class of crate RUSTSEC most
#     often has entries for.
#   licenses   - fails the build on a copyleft/unlisted license landing
#     transitively.
#   bans       - duplicate-version and explicitly-banned-crate checks.
#   sources    - only allow crates.io as a registry source.

[advisories]

db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # RUSTSEC-2024-0436 (`paste` unmaintained, reached only transitively via
    # rav1e -> pulp -> paste) previously ignored here no longer applies:
    # #67/#68 removed `ravif`/`rav1e` entirely (replaced by `libavif-sys` -
    # see Cargo.toml's `image`/`libavif-sys` dependency comments), which
    # also removed `paste` from the dependency graph - `cargo tree -i paste`
    # now finds nothing. Entry deleted rather than left as dead config.

    # RUSTSEC-2026-0258/0098/0099/0104 (h2 empty DATA frames; rustls-webpki
    # name-constraint and CRL-panic issues) were previously ignored here: GH #56
    # found `aws-sdk-s3`'s own `default` feature set pulled in BOTH TLS stacks
    # at once - `default-https-client` (the modern hyper-1/rustls-0.23/h2-0.4
    # connector actually used at runtime under BehaviorVersion::latest()) AND
    # `rustls` (a misleadingly-named feature that in fact wires up the
    # *legacy* hyper-0.14/rustls-0.21.12/rustls-webpki-0.101.7/h2-0.3.27
    # connector - unused dead code at runtime here, but still present in the
    # resolved dependency graph `cargo deny` scans). Dropping the `rustls`
    # feature from the `aws-sdk-s3` dependency in Cargo.toml (default-features
    # = false + explicit feature list) removed the legacy stack from the
    # graph entirely - no upstream release was needed. See GH #56.
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",

    # mozjpeg / mozjpeg-sys (#63 stage 2), for DCT-scaled JPEG decode. IJG is
    # permissive and OSI-recognised, but UNLIKE every other licence above it
    # carries an actual obligation: distributed documentation must state that
    # the software is "based in part on the work of the Independent JPEG
    # Group". That notice is in README.md and NOTICE — if this allow-list
    # entry is ever removed, remove the notice with it; if mozjpeg is kept,
    # the notice must stay. Do not treat this as a routine allow-list add.
    "IJG",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
# The `gen-server` path dependency that originally forced this is gone (#53
# deleted the OpenAPI codegen), and `publish = false` now sits in Cargo.toml,
# so `allow-wildcard-paths` applies properly. Kept at "warn" rather than
# tightened to "deny" in the same change that removed the cause - flip it to
# "deny" once a CI run confirms nothing else trips it.
wildcards = "warn"
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
