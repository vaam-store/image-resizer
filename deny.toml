# cargo-deny configuration (GH #46). Run locally with `cargo deny check`.
#
# Four checks, all wired into CI (.github/workflows/ci.yml):
#   advisories - RUSTSEC vulnerability / unmaintained / yanked scanning.
#     There was no advisory scanning at all before this on a dependency
#     tree that includes several image codecs (jpeg/png/webp) parsing
#     attacker-supplied bytes - exactly the class of crate RUSTSEC most
#     often has entries for.
#   licenses   - fails the build on a copyleft/unlisted license landing
#     transitively.
#   bans       - duplicate-version and explicitly-banned-crate checks.
#   sources    - only allow crates.io as a registry source.

[advisories]

db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # `paste` is unmaintained. NOT a vulnerability — an abandoned-crate notice,
    # no exploitability claim. Reaches us only transitively
    # (rav1e -> pulp -> paste), so there is no direct action available until
    # those upstreams migrate. Revisit when rav1e drops it.
    # Every other advisory present on 2026-08-19 was cleared by `cargo update`.
    "RUSTSEC-2024-0436",

    # --- All four below share ONE root cause and are NOT fixable from this
    # repo: `aws-smithy-http-client v1.3.0` (via `aws-config`/`aws-sdk-s3`,
    # i.e. only the optional `s3` feature) pins rustls 0.21.12 /
    # rustls-webpki 0.101.7 / h2 0.3.27. `cargo update` cannot move them;
    # the AWS SDK must bump its own TLS stack first. Tracked in GH #56.
    # Re-check on every aws-sdk-s3 bump and delete these the moment the
    # smithy client moves to rustls 0.23 / h2 0.4.
    "RUSTSEC-2026-0258",  # h2 empty DATA frames. Upstream rates it LOW severity.
    "RUSTSEC-2026-0098",  # webpki: name constraints wrongly accepted for URI names.
    "RUSTSEC-2026-0099",  # webpki: name constraints accepted for wildcard certs.
    "RUSTSEC-2026-0104",  # webpki: panic parsing CRLs. We do not use CRLs, so unreachable here.
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    # Permissive, OSI-approved, FSF-free. Pulled in transitively via
    # image -> ravif -> rav1e -> libfuzzer-sys (rav1e's own fuzz harness,
    # not something this crate calls). `image`'s default features enable
    # avif support even though Cargo.toml only lists jpeg/png/webp - the
    # Cargo.toml owner may want `default-features = false` on the `image`
    # dependency to drop this (and the rest of the avif/rav1e stack)
    # entirely rather than allow-listing around it.
    "NCSA",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
# The `gen-server` path dependency that originally forced this is gone (#53
# deleted the OpenAPI codegen), and `publish = false` now sits in Cargo.toml,
# so `allow-wildcard-paths` applies properly. Kept at "warn" rather than
# tightened to "deny" in the same change that removed the cause - flip it to
# "deny" once a CI run confirms nothing else trips it.
wildcards = "warn"
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
