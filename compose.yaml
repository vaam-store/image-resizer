services:
  tracking:
    image: jaegertracing/all-in-one:latest
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    ports:
      - "4317:4317" # OpenTelemetry gRPC receiver
      - "4318:4318" # OpenTelemetry receiver
      - "14268:14268" # Jaeger receiver
      - "16686:16686" # Jaeger UI
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  volume_init:
    image: busybox:latest
    volumes:
      - files:/app/data/images
    command:
      - /bin/sh
      - -c
      - |
        set -ex

        # Ensure the directory exists
        chown -R 65532:65532 /app/data/images
        chmod -R 775 /app/data/images
    # Optional: If you want to make it executable by others too, use 777 (less secure)
    # command: sh -c "chown -R 65532:65532 /app/data/images && chmod -R 777 /app/data/images"
    # Ensure this container runs and exits successfully
    restart: "no" # Don't restart after it completes its job
    deploy:
      resources: # Minimal resources for this ephemeral task
        limits:
          memory: 10M
          cpus: "0.01"

  app:
    deploy:
      replicas: 1
      resources:
        limits: &limits
          memory: 1G
          cpus: "1"
    build:
      context: .
      dockerfile: Dockerfile
      target: fs_otel_deploy
    volumes:
      - files:/app/data/images
    environment:
      CDN_BASE_URL: http://localhost:13001/api/images/files
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTLP_SPAN_ENDPOINT: http://tracking:4317
      OTLP_METRIC_ENDPOINT: http://tracking:4318/v1/metrics
      OTLP_SERVICE_NAME: image-resizer
      ENABLE_HTTP2: false
      # GH #84: #27 made signed-URL verification fail closed (SIGNING_KEY/
      # SIGNING_SALT, or an explicit ALLOW_UNSIGNED_REQUESTS=true) and #77
      # did the same for METRICS_AUTH_TOKEN on this otel target - neither
      # was ever forwarded here, so this service could never start.
      # compose.yaml exists for local development, so defaulting the two
      # opt-outs to "true" (a developer should not need to generate an
      # HMAC key just to see the thing run) is the right call here - unlike
      # the Helm charts, which deploy to real clusters and must not default
      # to insecure. SIGNING_KEY/SIGNING_SALT/METRICS_AUTH_TOKEN are still
      # forwarded from the environment (via .env, see .env.example) so a
      # real key overrides the unsigned/unauthenticated defaults - signing
      # a real key/salt is checked independently of ALLOW_UNSIGNED_REQUESTS
      # (src/modules/signing/config.rs), so setting one does not conflict
      # with the other.
      ALLOW_UNSIGNED_REQUESTS: ${ALLOW_UNSIGNED_REQUESTS:-true}
      SIGNING_KEY: ${SIGNING_KEY:-}
      SIGNING_SALT: ${SIGNING_SALT:-}
      ALLOW_UNAUTHENTICATED_METRICS: ${ALLOW_UNAUTHENTICATED_METRICS:-true}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
      # PERFORMANCE_PROFILE sizes concurrency off the *container's* core
      # count (num_cpus, see src/config/performance.rs's
      # high_throughput()), not a fixed number - it used to be paired with
      # an explicit MAX_CONCURRENT_PROCESSING: 40 override here, four
      # times the deploy.resources.limits.cpus: "1" cap above (GH #48).
      # Once the resize service's core-count detection is cgroup-aware,
      # letting the profile compute this itself is the correct default;
      # override explicitly only if you also raise `cpus` above.
      PERFORMANCE_PROFILE: high_throughput
    ports:
      - "13001:3000"
    depends_on:
      tracking:
        condition: service_started
      volume_init:
        condition: service_completed_successfully

  app-s3:
    deploy:
      replicas: 1
      resources:
        limits: *limits

    build:
      context: .
      dockerfile: Dockerfile
      target: s3_otel_deploy
    environment:
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ACCESS_KEY_ID: minio
      MINIO_SECRET_ACCESS_KEY: minio123
      MINIO_BUCKET: emgr
      MINIO_REGION: ~

      STORAGE_SUB_PATH: "gen/"

      CDN_BASE_URL: http://localhost:19000/emgr
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTLP_SPAN_ENDPOINT: http://tracking:4317
      OTLP_METRIC_ENDPOINT: http://tracking:4318/v1/metrics
      OTLP_SERVICE_NAME: image-resizer
      ENABLE_HTTP2: false
      # GH #84: see the identical comment on the `app` service above - same
      # fail-closed startup checks, same local-development default.
      ALLOW_UNSIGNED_REQUESTS: ${ALLOW_UNSIGNED_REQUESTS:-true}
      SIGNING_KEY: ${SIGNING_KEY:-}
      SIGNING_SALT: ${SIGNING_SALT:-}
      ALLOW_UNAUTHENTICATED_METRICS: ${ALLOW_UNAUTHENTICATED_METRICS:-true}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
      # PERFORMANCE_PROFILE sizes concurrency off the *container's* core
      # count (num_cpus, see src/config/performance.rs's
      # high_throughput()), not a fixed number - it used to be paired with
      # an explicit MAX_CONCURRENT_PROCESSING: 40 override here, four
      # times the deploy.resources.limits.cpus: "1" cap above (GH #48).
      # Once the resize service's core-count detection is cgroup-aware,
      # letting the profile compute this itself is the correct default;
      # override explicitly only if you also raise `cpus` above.
      PERFORMANCE_PROFILE: high_throughput
    ports:
      - "13002:3000"
    depends_on:
      tracking:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  minio-object-browser:
    image: bitnami/minio-object-browser
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 500M
    ports:
      - ${MINIO_PORT:-19090}:9090
    environment:
      CONSOLE_PBKDF_PASSPHRASE: some-passphrase
      CONSOLE_PBKDF_SALT: some-salt
      CONSOLE_MINIO_SERVER: "http://minio:9000"
    command:
      - server

  minio:
    image: bitnami/minio:latest
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 500M
    volumes:
      - minio:/bitnami/minio/data
    ports:
      - ${MINIO_PORT:-19000}:9000
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_BROWSER_SESSION_DURATION: 7d
      MINIO_BROWSER_LOGIN_ANIMATION: off

  minio-init:
    image: bitnami/minio
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 500M
    volumes:
      - .docker/minio/policy.json:/tmp/policy.json
    command:
      - /bin/bash
      - -c
      - |-
        set -e;

        sleep 5;

        mc alias set bucketer http://minio:9000 minio minio123;
        mc admin service restart bucketer --wait --json;

        sleep 5;

        mc mb bucketer/emgr --ignore-existing

        mc anonymous set-json /tmp/policy.json bucketer/emgr
    depends_on:
      minio:
        condition: service_started

volumes:
  files:
  minio:
