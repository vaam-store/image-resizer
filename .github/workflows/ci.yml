name: CI

# GH #46: build.yml only builds/pushes Docker images and lint-codebase.yml
# only runs super-linter - neither ran `cargo test` or a real `cargo
# clippy`. This workflow adds the missing test/lint/audit/benchmark gates.
#
# GH #45 / #53: `gen-server` used to be a path dependency generated from
# openapi.yaml by `make init` (which needed Docker) and, before that, was
# gitignored - so a fresh clone (and every job here) failed with "failed to
# get `gen-server` as a dependency" before running a single test. #53
# removed the codegen entirely: the HTTP router is hand-written now
# (src/modules/api, src/modules/router, src/modules/url), so no job needs
# Docker or `make init` at all any more.

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # One job per feature set. Previously this ran `local_fs` only, which
    # meant the `s3` feature's entire test suite never ran in CI at all -
    # that is how a completely non-starting `s3` image (GLIBC_2.38 against a
    # Debian 12 runtime) reached a release build unnoticed. `otel` was worse
    # than untested: it gates `/metrics`, so the auth added in GH #77 had no
    # CI coverage whatsoever on the endpoint it protects.
    #
    # `--no-default-features` is deliberate. `default = []` today, so it is
    # currently a no-op, but without it a future non-empty default would
    # silently pull `local_fs` into the `s3` job and stop these from being
    # the isolated feature sets they claim to be.
    name: Test (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        features:
          - local_fs
          - s3
          - local_fs,otel
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.features }}

      - name: cargo test --no-default-features --features ${{ matrix.features }}
        run: |
          cargo test --no-default-features \
            --features ${{ matrix.features }} --all-targets

  clippy:
    name: Clippy (non-blocking - TODO GH #46)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-local_fs

      # TODO(#46): drop `continue-on-error` once the existing warning
      # backlog is cleared and make this a required check. As of this
      # writing `cargo clippy --features local_fs --all-targets` reports
      # ~20 pre-existing warnings across src/ (dead_code,
      # collapsible_if, manual_saturating_arithmetic, unnecessary_closure,
      # doc-list-item indentation, a couple of module/method naming
      # lints - `interior_mutable_const`-style false positives not
      # among them). None of that is in the files this change owns, so
      # it isn't fixed here - see the PR description for the full list
      # from a local run. Left non-blocking rather than silently
      # allow-listing every lint away.
      - name: cargo clippy --features local_fs -- -D warnings
        continue-on-error: true
        run: cargo clippy --features local_fs --all-targets -- -D warnings

  cargo-deny:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Reads Cargo.lock directly - doesn't need `make init` or a build.
      # No `--all-features`: validated locally (see deny.toml's own
      # comments) against the feature set Cargo.lock actually resolved -
      # `--all-features` re-resolves against every feature including ones
      # nothing in this workflow ever builds with.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  docs-env-drift:
    name: Docs env-var drift check (GH #47)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: configuration.md must match env.rs exactly
        run: python3 .github/scripts/check_env_docs.py

  bench-baseline:
    name: Benchmarks (save main baseline)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-local_fs

      # Same invocation captured in .bench-baseline/BASELINE.md, kept
      # deliberately low sample-size/measurement-time to keep CI runtime
      # reasonable (GH #20: "start loose ... tighten once the numbers are
      # stable"). `--save-baseline main` writes to
      # target/criterion/<bench>/main/, which the cache step below
      # persists for PR runs to restore and compare against.
      - name: cargo bench --features local_fs -- --save-baseline main
        run: |
          cargo bench --features local_fs -- \
            --sample-size 20 --measurement-time 2 --warm-up-time 1 \
            --save-baseline main

      # actions/cache keys are immutable, so this always writes a new,
      # unique key (per-commit) rather than trying to overwrite one -
      # the PR-side `bench` job below finds it again via `restore-keys`
      # prefix matching, which resolves to the most recent entry.
      - name: Persist baseline for PR comparisons
        uses: actions/cache/save@v4
        with:
          path: target/criterion
          key: criterion-baseline-main-${{ github.sha }}

  bench:
    name: Benchmarks (regression gate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-local_fs

      # No `fail-on-cache-miss` - the very first PR after this workflow
      # lands (before any push to main has produced a baseline) simply
      # runs with no comparison; bench_gate.py treats that as "no
      # baseline" per benchmark rather than a failure.
      - name: Restore main baseline
        uses: actions/cache/restore@v4
        with:
          path: target/criterion
          key: criterion-baseline-main-${{ github.sha }}
          restore-keys: |
            criterion-baseline-main-

      # `--baseline-lenient`, not `--baseline`: plain `--baseline` makes
      # criterion hard-error when the named baseline is absent, which is
      # exactly the state of every PR until a push to main has saved one.
      # Lenient mode runs the benches and simply skips the comparison, which
      # is what bench_gate.py already expects to handle.
      - name: cargo bench --features local_fs -- --baseline-lenient main
        run: |
          cargo bench --features local_fs -- \
            --sample-size 20 --measurement-time 2 --warm-up-time 1 \
            --baseline-lenient main

      - name: Build regression report
        id: gate
        run: |
          set +e
          python3 .github/scripts/bench_gate.py --threshold 15 --output bench-report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Post/update PR comment with percentile table
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('bench-report.md', 'utf8');
            const marker = '<!-- bench-gate-report -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if any benchmark regressed past the threshold
        if: steps.gate.outputs.exit_code != '0'
        run: exit 1
