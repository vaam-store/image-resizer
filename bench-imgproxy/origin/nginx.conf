# Minimal static file origin for the benchmark corpus. Both emgr and
# imgproxy fetch source images from here so neither is measured against
# the public internet or against a different origin latency profile.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # gzip off: we want the exact on-disk bytes to be what each proxy
    # decodes, with no origin-side compression variance between requests.
    gzip off;

    access_log off;
    sendfile on;

    server {
        listen 80;
        server_name _;

        # Query strings (e.g. ?variant=N, used by the load driver to force
        # a cold-cache derivative without changing the actual image bytes
        # or requested transform) are ignored by nginx's static file
        # resolution -- every ?variant=N still serves the identical file.
        location /corpus/ {
            alias /usr/share/nginx/html/corpus/;
            add_header Cache-Control "no-store";
        }

        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
