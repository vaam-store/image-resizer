global:
  # `.github/workflows/build.yml` only ever publishes `fs-latest` (moves
  # on every push to the default branch) and per-commit sha tags
  # (`fs-<full-sha>`) - it has no release-tag trigger today, so there is
  # no immutable semver tag to default this to (GH #48's "floating tags"
  # finding; see the PR description for the full writeup). Production
  # deployments should override this to a specific `fs-<sha>` build.
  version: fs-latest

defaultPodOptions:
  securityContext:
    runAsUser: 1001
    runAsGroup: 1001

controllers:
  main:
    type: deployment
    replicas: 2
    pod:
      labels:
        main: emgr-app
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - emgr-app
              topologyKey: "kubernetes.io/hostname"
    labels:
      main: main-app
    podLabels:
      app: open-web-ui
    initContainers:
      permission-fix:
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        image:
          repository: busybox
          # Pinned by digest (GH #48) - "latest" is a floating tag.
          tag: latest@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          pullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            set -ex

            # Ensure the directory exists
            chown -R 1001:1001 /tmp/data/images
            chmod -R 775 /tmp/data/images
        resources:
          requests:
            cpu: 50m
            memory: 10Mi
          limits:
            cpu: 100m
            memory: 50Mi
    containers:
      app:
        image:
          repository: ghcr.io/vaam-store/image-resizer
          tag: '{{ .Values.global.version }}'
          # `global.version` defaults to the floating "fs-latest" tag (see
          # above), so `IfNotPresent` let different nodes keep whatever
          # they happened to already have cached under that tag name,
          # silently running different builds side by side (GH #48).
          # `Always` re-resolves the tag to its current digest on every
          # pod (re)start. If you override `global.version` to an
          # immutable `fs-<sha>` tag, `IfNotPresent` is safe to switch
          # back to for faster restarts.
          pullPolicy: Always

        # -- Probes: the bjw-s common library does NOT synthesize defaults,
        # so without this block traffic is routed to pods before storage and
        # the resize service finish initializing, and a wedged container is
        # never restarted (GH #48). Mirrors helm/serverless's Knative probes
        # (helm/serverless/templates/knative-service.yaml:48-59), which hit
        # the same /health endpoint.
        probes:
          liveness:
            enabled: true
            custom: false
            type: HTTP
            path: /health
            port: 3000
            spec:
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 3
          readiness:
            enabled: true
            custom: false
            type: HTTP
            path: /health
            port: 3000
            spec:
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 3
          startup:
            enabled: true
            custom: false
            type: HTTP
            path: /health
            port: 3000
            spec:
              initialDelaySeconds: 0
              periodSeconds: 5
              # 30 * 5s = 150s to finish starting up before it's killed.
              failureThreshold: 30

        resources:
          requests:
            cpu: 125m
            memory: 256Mi
          limits:
            cpu: 400m
            memory: 512Mi

        # -- ConfigMap to be loaded as environment variables
        envFrom:
          - configMapRef:
              identifier: config

        # -- GH #84: #27 made signed-URL verification fail closed
        # (SIGNING_KEY/SIGNING_SALT, or an explicit
        # ALLOW_UNSIGNED_REQUESTS=true) and #77 did the same for
        # METRICS_AUTH_TOKEN on an otel-enabled image - neither was ever
        # wired into this chart, so every pod crash-looped on boot.
        #
        # This is a real cluster, not a local compose.yaml, so it does NOT
        # default to ALLOW_UNSIGNED_REQUESTS=true/
        # ALLOW_UNAUTHENTICATED_METRICS=true - that would silently trade
        # security for convenience. Instead it points at a Secret named
        # `emgr-signing` that you create yourself (kubectl create secret
        # generic emgr-signing --from-literal=signing-key=... --from-literal
        # =signing-salt=... --from-literal=metrics-auth-token=...; this
        # chart intentionally does not create it, so the secret material
        # never lives in values.yaml or a values override). If that Secret
        # is missing, the pod fails loudly (CreateContainerConfigError)
        # instead of starting insecurely. METRICS_AUTH_TOKEN only matters
        # once `global.version` points at an `*_otel` image tag (see
        # below) - it is harmless, just unread, on the default `fs-latest`.
        env:
          SIGNING_KEY:
            valueFrom:
              secretKeyRef:
                name: emgr-signing
                key: signing-key
          SIGNING_SALT:
            valueFrom:
              secretKeyRef:
                name: emgr-signing
                key: signing-salt
          METRICS_AUTH_TOKEN:
            valueFrom:
              secretKeyRef:
                name: emgr-signing
                key: metrics-auth-token
                # `optional: true` (GH #77/#84): METRICS_AUTH_TOKEN is only
                # read by an `*_otel` image - the endpoint it protects does
                # not exist without that feature. Without `optional`, a
                # default (non-otel) deployment would fail with
                # CreateContainerConfigError over a key it never reads,
                # forcing operators to invent a dummy value. Marked optional
                # so a non-otel pod starts; an *otel* pod with no token still
                # fails closed, but at application startup with the error
                # that names both remedies, which is far more actionable than
                # a kubelet config error.
                optional: true

service:
  app:
    enabled: true
    annotations: { }
    nameOverride: service
    type: ClusterIP
    controller: main
    ports:
      http:
        enabled: true
        port: 3000
        targetPort: 3000

ingress:
  app:
    enabled: true
    annotations: { }
    nameOverride: ingress
    #className: 'nginx'
    hosts:
      - host: emgr.example.com
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: app
              port: http
    tls:
      - secretName: emgr-example-com-secret
        hosts:
          - emgr.example.com

configMaps:
  config:
    enabled: true
    annotations:
      description: 'Common configuration for the emgr.'
    data:
      LOCAL_FS_STORAGE_PATH: /tmp/data/images
      CDN_BASE_URL: https://emgr.com
      PERFORMANCE_PROFILE: high_throughput

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteMany
    size: 10Gi
    storageClass: ~
    advancedMounts:
      main:
        permission-fix:
          - path: /tmp/data/images
        app:
          - path: /tmp/data/images
