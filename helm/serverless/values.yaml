global:
  imageRegistry: ""
  ## e.g.
  ## imagePullSecrets:
  ##   - myRegistryKeySecretName
  ##
  imagePullSecrets: [ ]
  defaultStorageClass: ""
  ## Security parameters
  ##
  security:
    ## @param global.security.allowInsecureImages Allows skipping image verification
    allowInsecureImages: false

annotations: ~

labels: ~

podLabels: ~

podAnnotations: ~

image:
  # GH #85: `repository` below already includes the registry host, and
  # the Bitnami `common.images.image` helper this chart uses concatenates
  # `registry`/`repository` unconditionally - setting `registry: ghcr.io`
  # here rendered the doubled, non-existent `ghcr.io/ghcr.io/...`
  # reference. Leave this empty; `repository` carries the full path.
  registry: ""
  repository: ghcr.io/vaam-store/image-resizer
  # GH #85: `latest` matches no tag `.github/workflows/build.yml` actually
  # publishes - every published tag is flavour-prefixed (fs-latest,
  # fs_otel-latest, s3-latest, s3_otel-latest, plus per-commit
  # `<flavor>-<sha>`; see docs/deployment/docker.md). This chart's `env`
  # below is wired for S3/MinIO storage and sends OTLP_*/LOG_LEVEL
  # variables that only matter on an otel-enabled image, so `s3_otel` is
  # the matching flavour. `s3_otel-latest` is still a floating tag (moves
  # on every push to main - build.yml has no release-tag trigger today,
  # so there is no immutable semver tag to default to instead, the same
  # constraint documented on helm/emgr's values.yaml `global.version`).
  # Pin to a specific `s3_otel-<sha>` for anything beyond a quick smoke
  # test.
  tag: "s3_otel-latest"
  digest: ""
  ## Specify a imagePullPolicy
  ## ref: https://kubernetes.io/docs/concepts/containers/images/#pre-pulled-images
  ##
  pullPolicy: IfNotPresent
  ## Optionally specify an array of imagePullSecrets.
  ## Secrets must be manually created in the namespace.
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  ## e.g:
  ## pullSecrets:
  ##   - myRegistryKeySecretName
  ##
  pullSecrets: [ ]
  ## Set to true if you would like to see extra information on logs
  ##
  debug: false

env:
  MINIO_ACCESS_KEY_ID:
    secretKeyRef:
      name: minio
      key: access-key

  MINIO_SECRET_ACCESS_KEY:
    secretKeyRef:
      name: minio
      key: secret-key

  MINIO_ENDPOINT_URL: http://minio:9000
  MINIO_BUCKET: emgr
  MINIO_REGION: ~

  STORAGE_SUB_PATH: 'files/gen/'

  CDN_BASE_URL: http://localhost:19000/emgr

  # GH #85: `${LOG_LEVEL:-info}` is Docker Compose's `${VAR:-default}`
  # shell-parameter-expansion syntax. Helm's templating engine never
  # evaluates it, so the container received the literal string
  # `${LOG_LEVEL:-info}` as LOG_LEVEL, not a resolved default. Use a plain
  # value here - override it directly (`--set env.LOG_LEVEL=debug`) if you
  # want something other than the default.
  LOG_LEVEL: info
  OTLP_SPAN_ENDPOINT: http://tracking:4317
  OTLP_METRIC_ENDPOINT: http://tracking:4318/v1/metrics
  OTLP_SERVICE_NAME: image-resizer
  ENABLE_HTTP2: false
  PERFORMANCE_PROFILE: high_throughput
  MAX_CONCURRENT_PROCESSING: 4

  # GH #84: #27 made signed-URL verification fail closed (SIGNING_KEY/
  # SIGNING_SALT, or an explicit ALLOW_UNSIGNED_REQUESTS=true) and #77 did
  # the same for METRICS_AUTH_TOKEN on this otel-enabled image - neither
  # was ever wired into this chart, so every revision failed its startup
  # probe and never went Ready.
  #
  # This is a real cluster, not a local compose.yaml, so it does NOT
  # default to ALLOW_UNSIGNED_REQUESTS=true/
  # ALLOW_UNAUTHENTICATED_METRICS=true - that would silently trade
  # security for convenience. Instead it points at a Secret named
  # `emgr-signing` (same convention as helm/emgr) that you create
  # yourself, the same way `minio` already supplies
  # MINIO_ACCESS_KEY_ID/MINIO_SECRET_ACCESS_KEY above. If that Secret is
  # missing, the revision fails loudly instead of starting insecurely.
  SIGNING_KEY:
    secretKeyRef:
      name: emgr-signing
      key: signing-key
  SIGNING_SALT:
    secretKeyRef:
      name: emgr-signing
      key: signing-salt
  METRICS_AUTH_TOKEN:
    secretKeyRef:
      name: emgr-signing
      key: metrics-auth-token

ports:
  http1: # kservice requirements
    port: 3000

resources:
  limits:
    cpu: 1500m
    memory: 3Gi
  requests:
    cpu: 1000m
    memory: 2Gi

domain:
  enabled: false
  name: miaou.waff.waff
  tls: ~
#    issuerRef:
#      kind: ClusterIssuer
#      name: self-signed-ca
#      group: cert-manager.io
